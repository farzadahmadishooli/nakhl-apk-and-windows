name: Build Windows Installer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Build installer
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Nakhl-Installer
          path: windows/dist/NakhlAccounting-Setup.exe
